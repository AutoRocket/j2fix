[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "j2fix"
dynamic = ["version"]
description = "An opinionated Jinja2 formatter for the Arista j2lint standard"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AutoRocket" }]
keywords = ["arista", "formatter", "jinja", "jinja2", "linting"]
dependencies = [
  "j2lint>=1.3.0,<2.0.0",
  "tomli>=2.0.0; python_version < '3.11'",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
j2fix = "j2fix.cli:main"

[project.urls]
Homepage = "https://github.com/AutoRocket/j2fix"
Documentation = "https://github.com/AutoRocket/j2fix#readme"
Issues = "https://github.com/AutoRocket/j2fix/issues"
Source = "https://github.com/AutoRocket/j2fix"

[tool.hatch.version]
path = "src/j2fix/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/j2fix"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
