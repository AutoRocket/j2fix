name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade "pip>=26.2" "setuptools>=83"
          python -m pip install --upgrade --editable ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Test
        run: python -m pytest

      - name: Check installed dependencies
        run: python -m pip check

  package:
    name: Build and test distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - name: Install build tools
        run: |
          python -m pip install --upgrade "pip>=26.2" "setuptools>=83"
          python -m pip install --upgrade build twine
      - name: Build wheel from source distribution
        run: python -m build
      - name: Validate metadata
        run: python -m twine check --strict dist/*
      - name: Install wheel and run regression tests
        run: |
          python -m pip install dist/*.whl pytest
          python -m pip check
          j2fix --version
          python -m pytest

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"
      - name: Install project and security tools
        run: |
          python -m pip install --upgrade "pip>=26.2" "setuptools>=83"
          python -m pip install ".[dev]" pip-audit
      - name: Audit installed dependencies
        run: |
          python -m pip freeze --all --exclude j2fix > "$RUNNER_TEMP/audit-requirements.txt"
          python -m pip_audit --strict --no-deps --disable-pip --progress-spinner off -r "$RUNNER_TEMP/audit-requirements.txt"
